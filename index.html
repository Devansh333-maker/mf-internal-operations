<title>MF Operations Desk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: fixed left rail (stacks to a top bar on phones) + work area; client file opens as a right-hand drawer. */
:root {
  /* Bright, single light theme: white surfaces, indigo accent, one colour per major step. */
  --bg: #f4f6ff; --surface: #ffffff; --surface-2: #eef1fd; --line: #e2e6f3;
  --ink: #101828; --ink-2: #475467; --ink-3: #8a94a6;
  --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #eef0ff;
  --bad: #e5484d; --bad-soft: #ffeceb; --warn: #d97706; --warn-soft: #fff4dc;
  --good: #0f9f5f; --good-soft: #e3f8ee;
  --s1: #2e90fa; --s1-bg: #e6f1ff; --s2: #7a5af8; --s2-bg: #f0ecff; --s3: #e57a00; --s3-bg: #fff1dc;
  --s4: #dd2590; --s4-bg: #fdeaf5; --s5: #6172f3; --s5-bg: #eef0ff; --s6: #0b9a9a; --s6-bg: #dff6f6; --s7: #0f9f5f; --s7-bg: #e3f8ee;
  --f-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px; color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
a { color: var(--accent); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-size: 16px; letter-spacing: -0.01em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 6px; color: var(--ink-2); font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.count { font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.count.bad { background: var(--bad); color: #fff; }
.whoami { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.whoami select { width: 100%; }
.roles { display: flex; flex-wrap: wrap; gap: 4px; }

.main { padding-block: 24px 64px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head p { margin: 4px 0 0; color: var(--ink-2); }

.banner { padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.metric .v { font-family: var(--f-mono); font-size: 26px; font-weight: 500; line-height: 1.1; }
.metric .l { color: var(--ink-2); font-size: 12.5px; }
.metric.bad .v { color: var(--bad); }
.metric.warn .v { color: var(--warn); }
.role-block { display: flex; flex-direction: column; gap: 8px; }

.tasks { display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 16px 10px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task::before { content: ""; align-self: stretch; border-radius: 0 3px 3px 0; background: transparent; }
.task.overdue::before { background: var(--bad); }
.task.today::before { background: var(--warn); }
.task-main { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.task-main:focus-visible { outline: 2px solid var(--accent); }
.t-title { font-weight: 600; }
.t-client { color: var(--ink); }
.t-meta { color: var(--ink-3); font-size: 12px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.empty { padding: 22px 16px; color: var(--ink-3); text-align: left; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.overdue { background: var(--bad-soft); color: var(--bad); }
.chip.today { background: var(--warn-soft); color: var(--warn); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.lost { background: var(--surface-2); color: var(--ink-3); text-decoration: line-through; }
.chip.esc { background: var(--bad); color: #fff; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { all: unset; cursor: pointer; color: var(--accent); font-size: 12.5px; }
.link:focus-visible { outline: 2px solid var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }

input[type=text], input[type=tel], input[type=email], input[type=number], input[type=search], input[type=datetime-local], input[type=date], input:not([type]), select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
label.f input, label.f select, label.f textarea { color: var(--ink); font-weight: 400; font-size: 14px; }
label.ck { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.strip button { all: unset; cursor: pointer; flex: 0 0 auto; min-width: 104px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.strip button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.strip button:focus-visible { outline: 2px solid var(--accent); }
.strip .n { font-family: var(--f-mono); font-size: 18px; }
.strip .s { font-size: 11.5px; color: var(--ink-2); }
.strip .s i { font-style: normal; color: var(--ink-3); font-family: var(--f-mono); margin-right: 4px; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: var(--accent-soft); border-radius: var(--r); }

.funnel { display: flex; flex-direction: column; gap: 6px; }
.fbar { display: grid; grid-template-columns: 170px minmax(0, 1fr) 110px; gap: 10px; align-items: center; font-size: 13px; }
.fbar .track { height: 18px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.fbar .fill { height: 100%; background: var(--accent); border-radius: 3px; min-width: 2px; }
.fbar .nums { font-family: var(--f-mono); font-size: 12px; text-align: right; color: var(--ink-2); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgb(8 14 18 / .38); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.d-head { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.d-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.d-body { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.contact { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-2); font-size: 13px; align-items: center; }
.tracker { display: flex; gap: 3px; }
.tracker span { flex: 1; height: 5px; border-radius: 2px; background: var(--line); }
.tracker span.done { background: var(--accent); }
.tracker span.cur { background: var(--warn); }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; padding-top: 0; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; margin-top: 1px; }
.dot.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.note { padding: 10px 12px; border-radius: 6px; background: var(--surface-2); font-size: 13px; }
.note.bad { background: var(--bad-soft); color: var(--ink); }
.note.warn { background: var(--warn-soft); }
.file { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 6px; }
.attach { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.attach input { flex: 1 1 180px; }
.log { display: flex; flex-direction: column; gap: 0; }
.log div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.log div:first-child { border-top: 0; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
pre.json { margin: 0; font-family: var(--f-mono); font-size: 11.5px; white-space: pre-wrap; max-height: 180px; overflow: auto; background: var(--surface-2); padding: 10px; border-radius: 6px; user-select: all; }

#toasts { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 6px; font-size: 13px; max-width: min(90vw, 460px); box-shadow: 0 6px 20px rgb(0 0 0 / .18); }
.toast.bad { background: var(--bad); color: #fff; }


/* ---- simple view ---- */
.undo { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; background: #101828; color: #fff; padding: 10px 12px 10px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgb(16 24 40 / .25); max-width: min(92vw, 560px); font-size: 14px; }
.undo[hidden] { display: none; }
.undo .btn { background: #fff; color: #101828; border: 0; font-weight: 700; }
.undo .link { color: #cbd2e1; font-size: 14px; }
.undo span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mvrow { gap: 8px; }
.bulk.warn { background: #fef3f2; border-color: #fecdca; flex-wrap: wrap; }
.mvrow select { font-size: 13px; padding: 5px 8px; }
#toasts { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
.dayhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; }
.dayhead h1 { font-size: 24px; }
.dayhead p { margin: 4px 0 10px; color: var(--ink-2); font-size: 15px; }
.prog { width: min(360px, 70vw); height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.prog span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #7a5af8); border-radius: 99px; }
.late-t { color: var(--bad); font-weight: 600; }
.dot-late { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; }
.fchips { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; color: var(--ink-2); font-size: 14px; }
.fchip b { margin-left: 4px; color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
.fchip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.fchip.on b { color: #fff; }
.fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty-big { padding: 48px 20px; text-align: center; color: var(--ink-3); font-size: 16px; }
.btn.big { padding: 12px 20px; font-size: 15px; }
.stepper { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.stp { all: unset; cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.stp::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--line); }
.stp-n { font-size: 11px; font-weight: 700; color: var(--ink-3); }
.stp-l { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stp-c { font-family: var(--f-mono); font-size: 20px; color: var(--ink); }
.stp.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.stp:focus-visible { outline: 2px solid var(--accent); }
.stp.st-1::before { background: var(--s1); } .stp.st-2::before { background: var(--s2); } .stp.st-3::before { background: var(--s3); } .stp.st-4::before { background: var(--s4); }
.stp.st-5::before { background: var(--s5); } .stp.st-6::before { background: var(--s6); } .stp.st-7::before { background: var(--s7); }
td.tickcell { padding: 0 6px !important; }
table.sheet td.wrap { white-space: normal; line-height: 1.3; padding-block: 4px; font-size: 12.5px; }
.tick { all: unset; cursor: pointer; display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--ink-3); border: 1px dashed var(--line); background: var(--surface); }
.tick:hover { border-color: var(--accent); color: var(--accent); }
.tick.on { color: var(--good); background: var(--good-soft); border: 1px solid transparent; }
.tick:focus-visible { outline: 2px solid var(--accent); }
table.sheet th, table.sheet td { height: 40px; }
table.sheet .sort { height: 40px; line-height: 40px; }
table.sheet thead tr.frow th { top: 41px; }
.hello { border-radius: 16px; padding: 22px 24px; color: #fff; background: linear-gradient(120deg, #4f46e5 0%, #7a5af8 55%, #ee46bc 120%); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hello h1 { font-size: 26px; }
.hello p { margin: 4px 0 0; font-size: 15px; opacity: .95; }
.hello b { font-size: 20px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 18px; border-top: 1px solid var(--line); border-left: 4px solid transparent; }
.item:first-child { border-top: 0; }
.item.late { border-left-color: var(--bad); }
.item-main { all: unset; cursor: pointer; flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.item-main:focus-visible { outline: 2px solid var(--accent); }
.item-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.item-top b { font-size: 15px; }
.item-text { font-size: 15px; color: var(--ink); }
.item-hint { font-size: 12px; color: var(--ink-3); }
.item-act { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.step { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.s-1 { color: var(--s1); background: var(--s1-bg); } .s-2 { color: var(--s2); background: var(--s2-bg); } .s-3 { color: var(--s3); background: var(--s3-bg); }
.s-4 { color: var(--s4); background: var(--s4-bg); } .s-5 { color: var(--s5); background: var(--s5-bg); } .s-6 { color: var(--s6); background: var(--s6-bg); } .s-7 { color: var(--s7); background: var(--s7-bg); }
.more { all: unset; cursor: pointer; display: block; width: 100%; text-align: center; padding: 12px; color: var(--accent); font-weight: 600; border-top: 1px solid var(--line); }
details.fold > summary { cursor: pointer; padding: 12px 4px; font-weight: 600; color: var(--ink-2); list-style: none; }
details.fold > summary::before { content: "▸ "; color: var(--ink-3); }
details.fold[open] > summary::before { content: "▾ "; }
.steps6 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.steps6 span { font-size: 10.5px; font-weight: 600; text-align: center; padding: 5px 2px; border-radius: 6px; background: var(--surface-2); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps6 .s-1 { color: var(--s1); background: var(--s1-bg); }
.steps6 .s-2 { color: var(--s2); background: var(--s2-bg); }
.steps6 .s-3 { color: var(--s3); background: var(--s3-bg); }
.steps6 .s-4 { color: var(--s4); background: var(--s4-bg); }
.steps6 .s-5 { color: var(--s5); background: var(--s5-bg); }
.steps6 .s-6 { color: var(--s6); background: var(--s6-bg); }
.steps6 .s-7 { color: var(--s7); background: var(--s7-bg); }
.steps6 span.done { background: var(--good-soft); color: var(--good); }
.next { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.next-item { display: flex; flex-direction: column; gap: 6px; }
.next-item p { margin: 0; font-size: 17px; font-weight: 600; color: var(--ink); }
.sbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.sbar button { all: unset; cursor: pointer; flex: 0 0 auto; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 110px; }
.sbar button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.sbar .n { font-family: var(--f-mono); font-size: 20px; font-weight: 500; }
.sbar button:focus-visible { outline: 2px solid var(--accent); }
.side { background: #fff; }

}
function analyzeImport() {
  const imp = S.imp, byPhone = new Map(S.clients.map(c => [normPhone(c.phone), c]).filter(([k]) => k)), seen = new Set();
  const col = k => imp.map[k] === '' ? -1 : Number(imp.map[k]);
  return imp.data.map(raw => {
    const g = k => { const i = col(k); return i < 0 ? '' : raw[i]; };
    const r = {
      name: cellText(g('name')), phoneN: cellPhone(g('phone')), email: cellText(g('email')), portfolioRaw: cellText(g('portfolio')), portfolio: parseAmount(g('portfolio')),
      ownerKey: nameKey(cellText(g('owner'))), callDate: cellDate(g('callDate')), callTime: col('callTime') < 0 ? null : cellTimeMs(g('callTime')),
      disposition: cellText(g('disposition')), notes: cellText(g('notes')), quote: cellText(g('quote')), paymentAmount: g('paymentAmount'), paymentDate: cellDate(g('paymentDate')),
      agreement: cellText(g('agreement')), report: cellText(g('report')), requirement: cellText(g('requirement')), shared: cellText(g('shared')), deployed: cellText(g('deployed')), _agMapped: col('agreement') >= 0,
    };

    r.extra = extra;
    r.plan = rowPlan(r, imp.type);
    const ex = r.phoneN && byPhone.get(r.phoneN);

      : ex ? (imp.update && SI[r.plan.stage] > (ex.reached || 0) ? 'update' : 'Already in dashboard') : 'ok';
    r.existing = ex || null;
    if (r.phoneN) seen.add(r.phoneN);
    return r;
  });
}

const ACT = {

  exportSheet() { const t = curTab(); saveXlsx(`MF ${t.label} - ${stamp()}.xlsx`.replace(/&/g, 'and'), [[t.label, sheetXl(t, sheetRows(t))]]); },
  exportBook() { saveXlsx(`MF operations - all sheets - ${stamp()}.xlsx`, TABS.map(t => [t.label.replace(/&/g, 'and'), sheetXl(t, sheetRows(t, true))])); },
  exportDay() {
    const m = me(); if (!m) return;
    const list = S.clients.flatMap(tasksFor).filter(t => isMine(t, m)).sort((a, b) => a.due - b.due);
    saveXlsx(`${m.name} - my day - ${stamp()}.xlsx`, [['My day', list.map(t => ({ Name: nm(t.c), Portfolio: pfNum(t.c), Phone: normPhone(t.c.phone), Step: `${majorOf(t.c.stage).n}. ${majorOf(t.c.stage).label}`, 'What to do': nextText(t), Due: dmy(t.due) }))]]);
  },
  tab(ds) { S.tab = ds.v; ls.set('mfops.tab', ds.v); S.ed = null; S.plim = 200; S.sel.clear(); render(); const g = $('#grid'); if (g) g.scrollTop = 0; },
  async tickCell(ds) {
    const c = getC(ds.id), col = GC[ds.k]; if (!c || S.committing) return;
    const [off, on] = col.edit.opts(), isOn = String(curVal(col, c)) === String(on[0]);

  toggleMore(ds, el) { S.moreCols = el.checked; render(); },
  toggleFilters(ds, el) { S.showFilters = el.checked; if (!el.checked) (S.colf ||= {})[curTab().k] = {}; render(); },

  async edCommit(ds, el) { await commitEdit(ds.id, ds.k, el.value); },

  async bulkClose() {

    await batch(async () => { for (const id of [...S.sel]) { const c = getC(id); if (!c || c.status !== 'active') continue; try { await markLost(c, reason); } catch { break; } } }, n => `${n} clients closed: ${reason}`);

  async unpaidDone(ds) { const c = getC(ds.id); await moveTo(c, 'conversion', { unpaid: { at: Date.now() } }, 'stage', 'Interim report done'); toast('Now fix the pitch call'); },

async function loadSample() {
  if (S.clients.some(c => c.sample)) return toast('Sample data is already loaded.');
  const { team, batch, clients } = sampleDocs();
  try {
    for (const m of team) await withRetry(() => Store.set('team', m.id, m));
    await Store.set('batches', batch.id, batch);
    for (const c of clients) await withRetry(() => Store.set('clients', c.id, c));
    toast('Sample team and 16 sample clients added. Pick a sample name under “You are”.');
  } catch (e) { toast(dbErr(e), 'bad'); }
}

/* ------------------------------------------------------------------ *
 * Events + boot
 * ------------------------------------------------------------------ */
/* A client can be deleted by someone else while it is open here: stop quietly instead of throwing. */
function run(fn, ds, el, e) {
  if (ds.id && /^c_/.test(ds.id) && !getC(ds.id) && S.clients.length) { S.open = null; toast('This client was just removed by someone else.', 'bad'); return render(); }
  try { const r = fn(ds, el, e); if (r && r.catch) r.catch(err => console.warn(err)); } catch (err) { console.warn(err); toast('Something went wrong. Reload the page and try again.', 'bad'); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'TR' && e.target.closest('input, a, button, select, label')) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); run(fn, el.dataset, el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.d != null) D[el.dataset.d] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.f) { S.f[el.dataset.f] = el.value; S.sel.clear(); schedule(); }
  if (el.dataset.cf) { S.sel.clear(); const t = curTab().k; ((S.colf ||= {})[t] ||= {})[el.dataset.cf] = el.value; schedule(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.d != null) { D[el.dataset.d] = el.type === 'checkbox' ? el.checked : el.value; if (el.type === 'checkbox' && el.closest('.panel-b,.drawer')) schedule(); }
  const fn = ACT[el.dataset.change]; if (fn) run(fn, el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'ed') {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); commitEdit(e.target.dataset.id, e.target.dataset.k, e.target.value); }
    if (e.key === 'Escape') { S.ed = null; render(); }
    return;
  }
  if (e.key === 'Escape' && S.open) { S.open = null; render(); }
});
document.addEventListener('focusout', e => {
  const el = e.target; if (el.id !== 'ed' || !S.ed || !el.isConnected) return;
  if (el.tagName === 'INPUT') commitEdit(el.dataset.id, el.dataset.k, el.value);
  else setTimeout(() => { if (S.ed && !S.committing && document.activeElement?.id !== 'ed') { S.ed = null; render(); } }, 200);
});

async function boot() {
  render();
  await Store.init();
  if (Store.mode === 'db') {
    let user = null; try { user = await window.claude.use('user'); } catch {}
    S.isAdmin = user ? ((await user.canEdit()) || (await user.isOwner())) : true;
    try { S.dl = await window.claude.use('downloads'); } catch { S.dl = null; }
  }
  const seen = new Set(), done = k => { seen.add(k); if (seen.size >= 4 && !S.loaded) S.loaded = true; schedule(); };
  setTimeout(() => { if (!S.loaded) { S.loaded = true; schedule(); } }, 8000);
  Store.subscribe('team', l => { S.team = l.sort((a, b) => (a.name || '').localeCompare(b.name || '')); done('team'); });
  Store.subscribe('clients', l => { S.clients = l.map(normalizeClient); done('clients'); });
  Store.subscribe('batches', l => { S.batches = l; done('batches'); });
  Store.subscribe('settings', l => { const m = l.find(d => d.id === 'main'); S._settingsDoc = !!m; S.settings = { ...DEF, ...(m || {}) }; done('settings'); });
}
boot();
</script>
